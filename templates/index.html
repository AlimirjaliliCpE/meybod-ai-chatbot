
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دستیار هوشمند دانشگاه میبد</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, sans-serif;
    background: #f2f5fa;
}

.chat-container {
    width: 100%;
    max-width: 650px;
    height: 90vh;
    margin: 5vh auto;
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 5px 30px #0001;
    display: flex;
    flex-direction: column;
}

.header {
    background: #153d70;
    color: white;
    padding: 22px;
    text-align: center;
}

.header h3 {
    margin: 0 0 8px;
}

.header p {
    margin: 0;
    font-size: 12px;
    opacity: .8;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
}

.message {
    padding: 12px 15px;
    border-radius: 14px;
    margin-bottom: 14px;
    max-width: 85%;
    line-height: 2;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.bot {
    background: #edf2f8;
    margin-left: auto;
}

.user {
    background: #153d70;
    color: white;
    margin-right: auto;
}

.input-area {
    display: flex;
    gap: 10px;
    padding: 15px;
    border-top: 1px solid #eee;
}

input {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 13px;
    font-size: 14px;
    outline: none;
    min-width: 0;
}

button {
    background: #153d70;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 12px;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: wait;
}

</style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h3>دستیار هوشمند دانشگاه میبد</h3>
        <p>پاسخ‌گوی هوشمند سؤالات دانشگاهی شما</p>
        <p> نظرات، پیشنهادات و انتقادات خود را نسبت به چت بات با ما در میان بگذارید: AlimirjaliliCpE@</p>
    </div>

    <div class="messages" id="messages">
        <div class="message bot">
            سلام! 👋
            به دستیار هوشمند دانشگاه میبد خوش آمدید.
            چطور می‌توانم راهنمایی‌تان کنم؟
        </div>
    </div>

    <div class="input-area">
        <input
            id="messageInput"
            type="text"
            placeholder="سؤال خود را بنویسید..."
            maxlength="2000"
        >

        <button id="sendButton" onclick="sendMessage()">
            ارسال
        </button>
    </div>

</div>

<script>

const messages = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");

let history = [];

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    // Safe text insertion
    div.textContent = text;

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;

    return div;
}

async function sendMessage() {

    const message = input.value.trim();

    if (!message || sendButton.disabled) return;

    addMessage(message, "user");

    input.value = "";
    sendButton.disabled = true;

    const loading = addMessage("در حال دریافت پاسخ...", "bot");

    try {

        const response = await fetch("/api/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message,
                history: history
            })

        });

        const data = await response.json();

        loading.remove();

        if (!response.ok) {
            throw new Error(data.error || "خطا در دریافت پاسخ");
        }

        addMessage(data.answer, "bot");

        history.push(
            {role: "user", content: message},
            {role: "assistant", content: data.answer}
        );

        history = history.slice(-8);

    } catch (error) {

        loading.remove();

        addMessage(
            error.message || "ارتباط با سرور برقرار نشد.",
            "bot"
        );

    } finally {

        sendButton.disabled = false;
        input.focus();

    }
}

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
